<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alzikrayat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container gap-3">
      <a class="navbar-brand fw-bold" href="/">Alzikrayat</a>
      <a href="/">Gallery</a><a href="/about">About Us</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        {% if session.user_id %}
          <span>Hi {{ session.first_name }}</span>
          <form action="/logout" method="post"><button class="btn btn-outline-secondary btn-sm">Logout</button></form>
        {% else %}
          <a href="/login">Please Login</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% for message in get_flashed_messages() %}<div class="alert alert-warning">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
